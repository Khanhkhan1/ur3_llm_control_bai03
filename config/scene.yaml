# skill_server parameters (motion only -- skill_server never stores where the cubes are;
# every pick/place gets its coordinates from the camera through task_runner).
# The workspace layout shared by the Python nodes is in config/workspace.yaml.
skill_server:
  ros__parameters:
    planning_group: "ur_manipulator"
    # Table from worlds/tabletop.sdf (center + size), added to MoveIt's planning scene.
    table_center: [0.29, 0.0, 0.05]
    table_size: [0.42, 0.72, 0.10]
    # Cubes are 5 cm; the camera reports their centers on the table (z = 0.125).
    cube_size: 0.05
    # tool0 height when the 2F-85 grips a cube resting on the table. The pads span
    # 0.105-0.171 m below tool0 once closed on a 5 cm cube, so 0.282 keeps the pad tips
    # ~1 cm above the table and the gripper body ~3 cm above the cube top.
    grasp_z: 0.282
    # Released this much higher than grasp_z, so the cube drops the last few mm.
    place_clearance: 0.004
    # How far above grasp_z the tool hovers before descending / after lifting.
    approach_height: 0.10
    velocity_scaling: 0.3
    acceleration_scaling: 0.3
