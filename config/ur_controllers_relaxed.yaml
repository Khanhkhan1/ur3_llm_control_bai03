# Same controller_manager config as ur_simulation_gz's ur_controllers.yaml,
# but with a looser per-joint path tolerance (0.6 rad, vs. the stock 0.2).
#
# The stock 0.2 rad path tolerance assumes real-time-scheduled joint state
# feedback. On a non-real-time desktop OS (this package's RoboStack/macOS
# development setup), the simulated joint's reported position can lag the
# commanded trajectory point enough to trip the stock tolerance even for a
# correctly-planned move. 0.6 rad gives headroom for that lag while still
# aborting (rather than hanging) if a move is genuinely stuck -- e.g.
# planned into an unreachable pose or a joint limit.
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController


speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 1.0
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 2.0, goal: 0.3 }
      shoulder_lift_joint: { trajectory: 2.0, goal: 0.3 }
      elbow_joint: { trajectory: 2.0, goal: 0.3 }
      wrist_1_joint: { trajectory: 2.0, goal: 0.3 }
      wrist_2_joint: { trajectory: 2.0, goal: 0.3 }
      wrist_3_joint: { trajectory: 2.0, goal: 0.3 }


scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 1.0
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 2.0, goal: 0.3 }
      shoulder_lift_joint: { trajectory: 2.0, goal: 0.3 }
      elbow_joint: { trajectory: 2.0, goal: 0.3 }
      wrist_1_joint: { trajectory: 2.0, goal: 0.3 }
      wrist_2_joint: { trajectory: 2.0, goal: 0.3 }
      wrist_3_joint: { trajectory: 2.0, goal: 0.3 }

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    use_effort_interface: false
    use_speed_interface: false
    # Fingers that stop on a cube before reaching the commanded position have grasped it:
    # report that as success (the reached position tells skill_server what was gripped).
    allow_stalling: true
    stall_velocity_threshold: 0.05
    stall_timeout: 0.5
    goal_tolerance: 0.02
